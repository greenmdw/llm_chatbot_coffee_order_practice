<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>로그인</h1>

    <!-- 로그인 성공/실패 안내 배너. class 에 success/error 가 붙어서 색이 구분됨 -->
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        <!-- POST form은 CSRF 토큰 사용함 -->
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">로그인</button>
    </form>
<a href="{% url 'members:signup' %}">회원가입</a>
</body>
</html>
